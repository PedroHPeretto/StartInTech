name: Coding Agent (OpenHands)

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  resolve-ticket:
    if: >
      (github.event_name == 'issues' && (github.event.label.name == 'agent' || github.event.label.name == 'sweep')) ||
      (github.event_name == 'issue_comment' && (contains(github.event.comment.body, '@openhands-agent') || contains(github.event.comment.body, '@agent')))

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Prompt da Tarefa
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 -c "
          import os
          title = os.environ.get('ISSUE_TITLE', '')
          body = os.environ.get('ISSUE_BODY', '')
          number = os.environ.get('ISSUE_NUMBER', '')
          rules = ''
          if os.path.exists('AGENTS.md'):
              with open('AGENTS.md', 'r') as f:
                  rules = f.read()

          prompt = f'''Resolva a Issue #{number}: {title}

          Descricao da Issue:
          {body}

          Diretrizes do Repositorio (AGENTS.md):
          {rules}
          '''
          with open('task_prompt.txt', 'w') as f:
              f.write(prompt)
          "

      - name: Executar OpenHands via Docker
        env:
          WORKSPACE_BASE: ${{ github.workspace }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: "https://openrouter.ai/api/v1"
          LLM_MODEL: "openrouter/auto"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_API_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          MCP_SERVERS_CONFIG_PATH: ".agents/mcp_servers.json"
        run: |
          docker run -i --rm \
            -e SANDBOX_RUNTIME_CONTAINER_IMAGE="ghcr.io/all-hands-ai/runtime:0.32-nikolaik" \
            -e WORKSPACE_MOUNT_PATH="$WORKSPACE_BASE" \
            -e LLM_API_KEY="$LLM_API_KEY" \
            -e LLM_BASE_URL="$LLM_BASE_URL" \
            -e LLM_MODEL="$LLM_MODEL" \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -e SENTRY_AUTH_TOKEN="$SENTRY_AUTH_TOKEN" \
            -e LINEAR_API_KEY="$LINEAR_API_KEY" \
            -e MCP_SERVERS_CONFIG_PATH="$MCP_SERVERS_CONFIG_PATH" \
            -v "$WORKSPACE_BASE":/opt/workspace_base \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --add-host host.docker.internal:host-gateway \
            ghcr.io/all-hands-ai/openhands:0.32 \
            python -m openhands.core.main -t "$(cat task_prompt.txt)"

      - name: Ajustar permissões e limpar temporários
        if: always()
        run: |
          sudo chown -R $USER:$USER ${{ github.workspace }}
          rm -f task_prompt.txt

      - name: Criar Pull Request se houver alterações
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: resolve issue #${{ github.event.issue.number }} via OpenHands"
          branch: "agent/issue-${{ github.event.issue.number }}"
          title: "fix(agent): ${{ github.event.issue.title }}"
          body: |
            Resolução automatizada da issue #${{ github.event.issue.number }} gerada pelo agente OpenHands.
            
            Closes #${{ github.event.issue.number }}
          base: main
          labels: |
            agent
            automated-pr

      - name: Comentar na Issue com o link do PR
        if: steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.issue.number }},
              body: `🤖 OpenHands concluiu a tarefa e abriu o PR #${{ steps.cpr.outputs.pull-request-number }}: ${{ steps.cpr.outputs.pull-request-url }}`
            });